[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-control-tower-bus"
version = "3.0.0a1"
description = "Local-first, Root-governed CLI control tower for projects, agents, tasks, and auditable handoffs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
control-tower = "control_tower.cli:main"

[tool.setuptools.packages.find]
include = ["control_tower*"]
